name: Sync recipe runtime

on:
  push:
    branches:
      - agent/add-recipe-illustrations

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-recipe-illustrations
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate runtime
        run: node scripts/generate-recipe-runtime.mjs

      - name: Commit synced runtime and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/generated public/recipe-data
          git rm .github/workflows/sync-recipe-runtime.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync generated recipe runtime"
          git push origin HEAD:agent/add-recipe-illustrations
