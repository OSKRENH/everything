name: Compact photo catalog

on:
  push:
    branches: [agent/am-mobile-batch-and-photo-tz]
    paths: [.compact-photo-trigger]

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/am-mobile-batch-and-photo-tz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/compact-photo-catalog.mjs
      - name: Commit compact catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/recipe-photo-catalog.js
          git diff --cached --quiet && exit 0
          git commit -m "Compact recipe photo catalog"
          git push origin HEAD:agent/am-mobile-batch-and-photo-tz
