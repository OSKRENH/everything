name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser QA
        run: npx playwright test
