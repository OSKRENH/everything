name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      STRICT_SEO_MARKERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify generated recipe runtime
        run: |
          node scripts/generate-recipe-runtime.mjs
          git diff --exit-code -- worker/generated public/recipe-data
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Worker dry run and bundle budget
        run: |
          rm -rf .worker-dry
          npx wrangler deploy --dry-run --outdir .worker-dry
          node scripts/check-worker-bundle.mjs .worker-dry
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: QA public recipe routes
        run: npx playwright test test/e2e/public-routes.spec.mjs
      - name: QA catalog first twelve
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "первые двенадцать карточек"
      - name: QA catalog total
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "общий размер базы"
      - name: QA catalog cache freshness
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "версию кэша"
      - name: QA catalog facets
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "все страны"
      - name: QA catalog index
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "полный индекс"
      - name: QA catalog country paging
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "выбор страны"
      - name: QA catalog show more
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "Показать ещё"
      - name: QA fast matching
        run: npx playwright test test/e2e/fast-matching.spec.mjs
      - name: QA responsive layout
        run: npx playwright test test/e2e/responsive-layout.spec.mjs
      - name: QA kitchen simplified
        run: npx playwright test test/e2e/kitchen-simplified.spec.mjs
      - name: QA kitchen trust
        run: npx playwright test test/e2e/kitchen-trust.spec.mjs
      - name: QA next features
        run: npx playwright test test/e2e/next.spec.mjs
      - name: QA recipe tools
        run: npx playwright test test/e2e/recipe-tools.spec.mjs
      - name: QA resilient start
        run: npx playwright test test/e2e/resilient-start.spec.mjs
      - name: QA smoke
        run: npx playwright test test/e2e/smoke.spec.mjs
      - name: QA swipe all recipes
        run: npx playwright test test/e2e/swipe-all-recipes.spec.mjs
      - name: Purge Cloudflare cache after main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare purge skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID repository secrets to enable it."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
      - name: Verify live sitemap and trigger D1 schema migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          expected=$(node --input-type=module -e 'import { seoRecipeEntries } from "./worker/seo-pages.js"; console.log(seoRecipeEntries(2).length + 2)')
          actual=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 https://kutno.ru/sitemap.xml -o /tmp/kutno-sitemap.xml; then
              actual=$(node --input-type=module -e 'import fs from "node:fs"; const xml=fs.readFileSync("/tmp/kutno-sitemap.xml","utf8"); console.log((xml.match(/<loc>/g)||[]).length)')
            fi
            if [ "$actual" = "$expected" ]; then
              break
            fi
            echo "Waiting for fresh sitemap: expected $expected URLs, got $actual (attempt $attempt/12)"
            sleep 10
          done
          if [ "$actual" != "$expected" ]; then
            echo "Live sitemap is stale: expected $expected URLs, got $actual"
            exit 1
          fi
          echo "Live sitemap is fresh: $actual URLs"

          expected_images=$(node --input-type=module -e 'import { seoRecipeEntries } from "./worker/seo-pages.js"; console.log(seoRecipeEntries(2).length)')
          actual_images=$(node --input-type=module -e 'import fs from "node:fs"; const xml=fs.readFileSync("/tmp/kutno-sitemap.xml","utf8"); console.log((xml.match(/<image:image>/g)||[]).length)')
          if [ "$actual_images" != "$expected_images" ]; then
            echo "Live image sitemap is incomplete: expected $expected_images images, got $actual_images"
            exit 1
          fi
          if ! rg -q 'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"' /tmp/kutno-sitemap.xml; then
            echo "Live sitemap is missing the image namespace"
            exit 1
          fi
          echo "Live image sitemap is complete: $actual_images images"

          curl --fail --silent --show-error --max-time 20 https://kutno.ru/robots.txt -o /tmp/kutno-robots.txt
          if rg -q '^Disallow: /api/$' /tmp/kutno-robots.txt; then
            echo "robots.txt still blocks all API URLs, so Google cannot observe X-Robots-Tag"
            exit 1
          fi
          for rule in 'Disallow: /api/auth/' 'Disallow: /api/telemetry' 'Sitemap: https://kutno.ru/sitemap.xml'; do
            if ! rg -Fq "$rule" /tmp/kutno-robots.txt; then
              echo "robots.txt is missing required rule: $rule"
              exit 1
            fi
          done

          curl --fail --silent --show-error --max-time 20 --dump-header /tmp/kutno-api-headers.txt 'https://kutno.ru/api/catalog?limit=1' -o /tmp/kutno-api-catalog.json
          if ! tr -d '\r' < /tmp/kutno-api-headers.txt | rg -qi '^x-robots-tag: noindex, nofollow$'; then
            echo "Live API response is missing X-Robots-Tag: noindex, nofollow"
            exit 1
          fi
          echo "Live robots.txt and API indexing headers are correct"

          status=$(curl --silent --show-error --max-time 20 -o /tmp/kutno-feature-state.json -w '%{http_code}' https://kutno.ru/api/feature-state)
          if [ "$status" != "401" ]; then
            echo "Feature-state migration probe returned HTTP $status instead of 401"
            cat /tmp/kutno-feature-state.json || true
            exit 1
          fi
          echo "D1 schema migration probe completed before expected auth rejection (HTTP 401)."
