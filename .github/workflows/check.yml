name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Worker dry run
        run: npx wrangler deploy --dry-run
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: QA public recipe routes
        run: npx playwright test test/e2e/public-routes.spec.mjs
      - name: QA catalog first twelve
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "первые двенадцать карточек"
      - name: QA catalog total
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "общий размер базы"
      - name: QA catalog cache freshness
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "версию кэша"
      - name: QA catalog facets
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "все страны"
      - name: QA catalog index
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "полный индекс"
      - name: QA catalog country paging
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "выбор страны"
      - name: QA catalog show more
        run: npx playwright test test/e2e/catalog-all-pages.spec.mjs --grep "Показать ещё"
      - name: QA fast matching
        run: npx playwright test test/e2e/fast-matching.spec.mjs
      - name: QA kitchen simplified
        run: npx playwright test test/e2e/kitchen-simplified.spec.mjs
      - name: QA kitchen trust
        run: npx playwright test test/e2e/kitchen-trust.spec.mjs
      - name: QA next features
        run: npx playwright test test/e2e/next.spec.mjs
      - name: QA recipe tools
        run: npx playwright test test/e2e/recipe-tools.spec.mjs
      - name: QA resilient start
        run: npx playwright test test/e2e/resilient-start.spec.mjs
      - name: QA smoke
        run: npx playwright test test/e2e/smoke.spec.mjs
      - name: QA swipe all recipes
        run: npx playwright test test/e2e/swipe-all-recipes.spec.mjs
      - name: Purge Cloudflare cache after main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare purge skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID repository secrets to enable it."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
