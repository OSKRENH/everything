name: Provision Kutno storage

on:
  push:
    branches:
      - agent/provision-kutno-storage

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve Cloudflare account
        id: account
        shell: bash
        run: |
          set -euo pipefail
          zone=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account_id=$(printf '%s' "$zone" | jq -r '.result.account.id // empty')
          test -n "$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "Cloudflare account resolved."

      - name: Ensure recipe KV namespace
        id: kv
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          namespaces=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          namespace_id=$(printf '%s' "$namespaces" | jq -r '.result[] | select(.title == "kutno-recipe-bodies") | .id' | head -n1)
          if [ -z "$namespace_id" ]; then
            created=$(curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"kutno-recipe-bodies"}')
            namespace_id=$(printf '%s' "$created" | jq -r '.result.id // empty')
          fi
          test -n "$namespace_id"
          echo "namespace_id=$namespace_id" >> "$GITHUB_OUTPUT"
          echo "KV_NAMESPACE_ID=$namespace_id"

      - name: Ensure image R2 bucket
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -o /tmp/r2-bucket.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/kutno-images" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$status" = "200" ] && jq -e '.success == true' /tmp/r2-bucket.json >/dev/null; then
            echo "R2 bucket kutno-images already exists."
            exit 0
          fi
          created=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"kutno-images","locationHint":"weur"}')
          printf '%s' "$created" | jq -e '.success == true' >/dev/null
          echo "R2 bucket kutno-images created."

      - name: Provisioning summary
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        run: |
          echo "ACCOUNT_ID=$ACCOUNT_ID"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID"
          echo "R2_BUCKET=kutno-images"
