name: Repair recipe assets

on:
  push:
    branches:
      - agent/add-recipe-illustrations

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-recipe-illustrations
          fetch-depth: 0

      - name: Download repaired WebP archive
        run: |
          curl --fail-with-body --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1xO2b3gms7y93ihbk0O_qQxRVvIW681T7&export=download&confirm=t" \
            --output /tmp/kutno-repaired-webp-29.zip
          unzip -tq /tmp/kutno-repaired-webp-29.zip
          count=$(unzip -Z1 /tmp/kutno-repaired-webp-29.zip | grep -E '\.webp$' | wc -l | tr -d ' ')
          test "$count" = "87"
          echo "Archive verified: $count WebP files"

      - name: Replace corrupted recipe illustrations
        run: |
          unzip -o /tmp/kutno-repaired-webp-29.zip -d public/img
          node scripts/check-static-recipe-assets.mjs public/img

      - name: Commit repaired assets and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img
          git rm .github/workflows/repair-recipe-assets.yml
          git commit -m "Replace corrupted recipe illustrations"
          git push origin HEAD:agent/add-recipe-illustrations
