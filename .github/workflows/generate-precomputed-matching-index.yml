name: Generate Precomputed Matching Index

on:
  push:
    branches:
      - fix/precomputed-matching-index-20260811
    paths:
      - scripts/generate-recipe-runtime.mjs
      - scripts/apply-precomputed-matching-index.mjs
      - .github/workflows/generate-precomputed-matching-index.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch matcher to consume build-time index
        run: node scripts/apply-precomputed-matching-index.mjs
      - name: Regenerate recipe runtime
        run: node scripts/generate-recipe-runtime.mjs
      - name: Validate generated matcher
        run: |
          node --check worker/matching-entry.js
          node -e 'const x=require("fs").readFileSync("public/recipe-data/catalog-runtime.json","utf8");const p=JSON.parse(x);if(p.recipes.length!==227||p.recipes.some(r=>!Array.isArray(r.matchTerms)||!Array.isArray(r.matchPrefixes)))process.exit(1);console.log("precomputed index ok",p.recipes.length)'
          npm test
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/matching-entry.js public/recipe-data/catalog-runtime.json worker/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate precomputed matching index"
          git push origin HEAD:fix/precomputed-matching-index-20260811
