name: Generate recipe runtime data

on:
  push:
    branches: [agent/slim-worker-bundle]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/slim-worker-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-recipe-runtime.mjs
      - run: node scripts/patch-worker-runtime.mjs
      - name: Commit generated runtime data
        run: |
          if [ -z "$(git status --porcelain -- worker/generated public/recipe-data worker/index.js)" ]; then
            echo "Generated data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/generated public/recipe-data worker/index.js
          git commit -m "Сгенерировать компактные runtime-данные рецептов"
          git push origin HEAD:agent/slim-worker-bundle
